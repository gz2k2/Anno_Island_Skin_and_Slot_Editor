name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller customtkinter pillow

      - name: Read version
        id: version
        shell: pwsh
        run: |
          if (-not (Test-Path 'version.txt')) {
            throw 'version.txt was not found.'
          }

          $version = (Get-Content 'version.txt' -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'version.txt is empty.'
          }

          "VERSION=$version" >> $env:GITHUB_OUTPUT
          "TAG=v$version" >> $env:GITHUB_OUTPUT
          "EXE=Anno_Island_Reskinner_$version.exe" >> $env:GITHUB_OUTPUT

      - name: Validate tag version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $expected = '${{ steps.version.outputs.TAG }}'
          $actual = '${{ github.ref_name }}'
          if ($actual -ne $expected) {
            throw "Tag '$actual' does not match version.txt ('$expected')."
          }

      - name: Build one-file EXE
        shell: pwsh
        run: |
          python 00_build_onefile.py

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = Join-Path 'dist' '${{ steps.version.outputs.EXE }}'
          if (-not (Test-Path $exe)) {
            throw "Expected executable was not created: $exe"
          }
          Get-Item $exe | Format-List Name, Length, FullName

      - name: Read changelog
        id: changelog
        shell: pwsh
        run: |
          if (Test-Path 'changelog.md') {
            $content = Get-Content 'changelog.md' -Raw
          } else {
            $content = 'No changelog.md was included in this release.'
          }

          $delimiter = "CHANGELOG_$([guid]::NewGuid().ToString('N'))"
          "BODY<<$delimiter" >> $env:GITHUB_OUTPUT
          $content >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Anno Island Reskinner v${{ steps.version.outputs.VERSION }}
          target_commitish: ${{ github.sha }}
          files: dist/${{ steps.version.outputs.EXE }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Anno Island Reskinner v${{ steps.version.outputs.VERSION }}

            Automatic Windows one-file build created with the project's `00_build_onefile.py` builder.

            ### Changelog
            ${{ steps.changelog.outputs.BODY }}

            ### Download
            Download `${{ steps.version.outputs.EXE }}` from the Assets section below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
