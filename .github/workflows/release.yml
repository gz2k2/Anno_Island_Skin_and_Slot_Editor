name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || startsWith(github.event.head_commit.message, 'v')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Read Version and Changelog
        id: get_version
        shell: pwsh
        run: |
          if (-not (Test-Path 'version.txt')) {
            throw 'version.txt was not found.'
          }

          $version = (Get-Content 'version.txt' -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'version.txt is empty.'
          }

          "VERSION=$version" >> $env:GITHUB_OUTPUT
          "EXE_NAME=Anno_Island_Skin_and_Slot_Editor_v$version.exe" >> $env:GITHUB_OUTPUT

          if (Test-Path 'changelog.md') {
            $changelog = Get-Content 'changelog.md' -Raw
          }
          else {
            $changelog = 'No changelog was provided for this release.'
          }

          $delimiter = "CHANGELOG_$([guid]::NewGuid().ToString('N'))"
          "CHANGELOG<<$delimiter" >> $env:GITHUB_OUTPUT
          $changelog >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

      - name: Validate Tag Version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $expectedTag = "v${{ steps.get_version.outputs.VERSION }}"
          $actualTag = "${{ github.ref_name }}"

          if ($actualTag -ne $expectedTag) {
            throw "Git tag '$actualTag' does not match version.txt ('$expectedTag')."
          }

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          python 00_build_onefile.py

      - name: Verify Build Output
        shell: pwsh
        run: |
          $exePath = Join-Path 'dist' '${{ steps.get_version.outputs.EXE_NAME }}'

          if (-not (Test-Path $exePath -PathType Leaf)) {
            Write-Host 'Content of dist:'
            Get-ChildItem 'dist' -Recurse -ErrorAction SilentlyContinue
            throw "Expected executable was not created: $exePath"
          }

          Get-Item $exePath | Format-List Name, Length, FullName

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ steps.get_version.outputs.EXE_NAME }}
            tools/tools.zip
          name: v${{ steps.get_version.outputs.VERSION }}
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Automatic build of version ${{ steps.get_version.outputs.VERSION }}.

            ${{ steps.get_version.outputs.CHANGELOG }}

            ### Changes
            See the automatic release notes below or the commit history.

            ### Download
            You can find `${{ steps.get_version.outputs.EXE_NAME }}` in the Assets section below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
